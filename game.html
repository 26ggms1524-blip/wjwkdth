<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Cloud Jumper - Game Stage</title>
    <style>
        /* 레트로 픽셀 웹폰트 로드 */
        @import url('https://jsdelivr.net');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #1a1c2e, #393e46);
            font-family: 'DungGeunMo', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* 메인 메뉴와 일치시킨 상단 컨트롤 영역 */
        .hud-container {
            width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            z-index: 10;
        }

        .hud {
            color: #ffeaa7;
            font-size: 1.5rem;
            text-shadow: 2px 2px 0px #2d3436;
        }

        /* 🎨 [색상 및 폰트 변경] 소다색 베이스와 고전 아케이드 픽셀 룩 스타일링 */
        .exit-btn {
            background-color: #74b9ff; /* 청량한 레트로 소다 블루 */
            color: white;
            border: 3px solid #2d3436;
            box-shadow: 0px 4px 0px #0984e3, 4px 8px 0px #2d3436; /* 묵직한 아케이드 입체 입자 */
            padding: 8px 16px;
            font-size: 1.2rem; /* 옛날 게임 인터페이스 가독성 확장 */
            letter-spacing: 1px; /* 자간 조정을 통한 도트 자막 연출 */
            text-shadow: 2px 2px 0px #0984e3; /* 글자 내벽 음영 추가 */
            cursor: pointer;
            font-family: 'DungGeunMo', monospace;
            position: relative;
            transition: none; /* 도트 특유의 칼같은 반응을 위해 트랜지션 제한 */
        }
        .exit-btn:hover {
            background-color: #0984e3;
            color: #ffeaa7; /* 올드 팩 게임기 특유의 옐로우 폰트 스위칭 */
            box-shadow: 0px 2px 0px #054b82, 4px 6px 0px #2d3436;
            transform: translateY(2px) translateX(0px);
            text-shadow: 2px 2px 0px #054b82;
        }
        .exit-btn:active {
            box-shadow: 0px 0px 0px #000, 2px 2px 0px #2d3436;
            transform: translateY(6px) translateX(2px); /* 완벽하게 오락기 기판 하단으로 침강하는 터치 모션 */
        }

        /* 8비트 게임기 스타일 메인 스크린 컨테이너 (메인 메뉴와 완벽하게 일치하는 규격) */
        .game-container {
            position: relative;
            width: 600px;
            height: 400px;
            background-color: #5c94fc; 
            border: 6px solid #ff6b81; /* 레트로 핑크 메탈릭 네온 테두리 */
            box-shadow: 0px 0px 20px rgba(255, 107, 129, 0.4), 12px 12px 0px #1e2124;
            overflow: hidden;
        }

        /* CRT 모니터 스타일 격자 텍스처 무늬 효과 */
        .game-container::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.08) 2px, transparent 0),
                linear-gradient(90deg, rgba(255, 255, 255, 0.08) 2px, transparent 0);
            background-size: 16px 16px;
            pointer-events: none;
            z-index: 10;
        }

        .game-obj {
            position: absolute;
            box-sizing: border-box;
        }

        /* 플레이어 (도트 캐릭터) */
        #player {
            width: 24px;
            height: 32px;
            background-color: #ff6b81;
            border: 3px solid #2d3436;
            box-shadow: inset -4px -4px 0px #ee5253;
            z-index: 5;
        }

        /* 도트 구름 발판 */
        .platform {
            height: 16px;
            background-color: #ffffff;
            border: 3px solid #2d3436;
            box-shadow: inset 0 -4px 0px #b2bec3; 
            z-index: 4;
        }

        /* 레트로 음료수 캔 아이템 */
        .item {
            width: 16px;
            height: 24px;
            background-color: #ffeaa7;
            border: 2px solid #2d3436;
            box-shadow: inset -3px -3px 0px #fdcb6e;
            animation: itemFloat 0.6s ease-in-out infinite alternate;
            z-index: 4;
        }

        /* --- 플레이 안내 팝업창 모달 레이아웃 --- */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-box {
            background-color: #fff;
            border: 4px solid #2d3436;
            box-shadow: 6px 6px 0px #2d3436;
            width: 380px;
            padding: 30px;
            text-align: center;
            box-sizing: border-box;
        }

        .modal-title { 
            font-size: 1.8rem; 
            color: #ff6b81; 
            margin-top: 0; 
            margin-bottom: 20px; 
            text-shadow: 2px 2px 0px #ffeaa7; 
        }
        
        .modal-desc { 
            font-size: 1.1rem; 
            color: #2d3436; 
            line-height: 1.8; 
            margin-bottom: 25px; 
            text-align: left; 
            background: #f5f6fa; 
            padding: 15px; 
            border: 2px dashed #b2bec3; 
        }
        
        .start-btn { 
            background-color: #1dd1a1; 
            color: white; 
            padding: 12px 24px; 
            font-size: 1.3rem; 
            border: 3px solid #2d3436; 
            box-shadow: 0px 4px 0px #10ac84, 3px 6px 0px #000;
            cursor: pointer; 
            font-family: 'DungGeunMo', monospace; 
        }
        .start-btn:hover { 
            background-color: #10ac84; 
            box-shadow: 0px 3px 0px #0b775c, 3px 5px 0px #000;
            transform: translateY(1px); 
        }
        .start-btn:active {
            box-shadow: 0px 0px 0px #000, 1px 1px 0px #000;
            transform: translateY(4px) translateX(1px);
        }

        @keyframes itemFloat { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }
        .controls-guide { margin-top: 15px; color: #b2bec3; font-size: 1rem; text-align: center; }
    </style>
</head>
<body>

    <!-- 상단 점수판 및 소다색 픽셀 버튼 영역 -->
    <div class="hud-container">
        <div class="hud">SCORE: <span id="scoreVal">000</span></div>
        <button class="exit-btn" onclick="window.location.href='main.html'">메뉴로 나가기</button>
    </div>

    <div class="game-container" id="gameScreen">
        <!-- 주인공 캐릭터 플레이어 -->
        <div id="player" class="game-obj"></div>

        <!-- 한국어로 변경 및 버튼 버그 수정한 알림창 모달 -->
        <div class="modal-overlay" id="guideModal">
            <div class="modal-box">
                <div class="modal-title">게임 방법</div>
                <div class="modal-desc">
                    • ◀ / ▶ : 좌우 이동 (A / D)<br>
                    • ▲ / SPACE : 점프하기 (W)<br><br>
                    둥실둥실 떠다니는 도트 구름 발판을 밟고 올라가 화면 속 소다 캔을 모두 수집하여 높은 점수를 획득해 보세요!
                </div>
                <button class="start-btn" onclick="startGame()">게임 시작</button>
            </div>
        </div>
    </div>

    <!-- 하단 고정 키 조작 가이드 -->
    <div class="controls-guide">[◀] [▶] 이동 &nbsp;&nbsp;|&nbsp;&nbsp; [SPACE] 또는 [▲] 점프</div>

    <script>
        const screen = document.getElementById('gameScreen');
        const playerEl = document.getElementById('player');
        const scoreEl = document.getElementById('scoreVal');
        const guideModal = document.getElementById('guideModal');

        const screenWidth = 600; const screenHeight = 400;
        let player = { x: 280, y: 300, vx: 0, vy: 0, width: 24, height: 32, isGrounded: false };
        let score = 0; const gravity = 0.4; const jumpForce = -9.5; const moveSpeed = 4.5;
        const keys = {}; let gameActive = false;

        const platforms = [
            { x: 0, y: 380, width: 600 }, { x: 80, y: 300, width: 120 }, { x: 380, y: 280, width: 140 },
            { x: 220, y: 210, width: 140 }, { x: 40, y: 140, width: 110 }, { x: 440, y: 130, width: 100 }, { x: 250, y: 90, width: 100 }
        ];
        
        let items = [
            { x: 130, y: 260, active: true }, { x: 450, y: 240, active: true }, { x: 280, y: 170, active: true },
            { x: 90, y: 100, active: true }, { x: 480, y: 90, active: true }, { x: 290, y: 50, active: true }
        ];

        function initMap() {
            platforms.forEach((plat, index) => {
                if(index > 0) {
                    const el = document.createElement('div');
                    el.className = 'game-obj platform';
                    el.style.left = plat.x + 'px'; el.style.top = plat.y + 'px'; el.style.width = plat.width + 'px';
                    screen.appendChild(el);
                }
            });
            items.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'game-obj item'; el.id = `item-${index}`;
                el.style.left = item.x + 'px'; el.style.top = item.y + 'px';
                screen.appendChild(el);
            });
        }

        window.addEventListener('keydown', e => { if(gameActive) keys[e.code] = true; });
        window.addEventListener('keyup', e => { if(gameActive) keys[e.code] = false; });

        function startGame() {
            guideModal.style.display = 'none'; 
            gameActive = true;                
        }

        function update() {
            if (gameActive) {
                if (keys['ArrowLeft'] || keys['KeyA']) {
                    player.vx = -moveSpeed; playerEl.style.transform = 'scaleX(-1)';
                } else if (keys['ArrowRight'] || keys['KeyD']) {
                    player.vx = moveSpeed; playerEl.style.transform = 'scaleX(1)';
                } else { player.vx = 0; }

                if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.isGrounded) {
