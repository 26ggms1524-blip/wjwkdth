<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>
Earthquake Live Monitor
</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>


html,body{

margin:0;
padding:0;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;

}


#map{

position:absolute;

left:330px;

top:0;

right:0;

bottom:0;

background:white;

}



#panel{

position:absolute;

left:0;

top:0;

width:330px;

height:100%;

background:#111827;

color:white;

z-index:999;

padding:15px;

overflow-y:auto;

}



#panel h1{

font-size:22px;

margin:0 0 10px;

}



.info{

color:#cbd5e1;

font-size:13px;

line-height:1.5;

}



button{

width:100%;

padding:10px;

margin-top:10px;

border:none;

border-radius:6px;

background:#2563eb;

color:white;

cursor:pointer;

}



button:hover{

background:#1d4ed8;

}



.event{

background:#1f2937;

padding:12px;

margin-top:10px;

border-radius:8px;

cursor:pointer;

}



.event:hover{

background:#374151;

}



.mag{

font-size:22px;

font-weight:bold;

}



.place{

font-size:13px;

margin-top:5px;

}



.time{

font-size:12px;

color:#9ca3af;

margin-top:5px;

}



.legend{

margin-top:15px;

font-size:12px;

}



</style>

</head>


<body>


<div id="panel">


<h1>
🌍 Earth Monitor
</h1>


<div class="info">

흰색 : 바다<br>

하늘색 : 대륙<br>

빨간 점선 : 판 경계<br>

최근 24시간 지진

</div>



<button onclick="loadEarthquakes()">

지진 데이터 새로고침

</button>



<hr>


<div id="list">

데이터 불러오는 중...

</div>


</div>



<div id="map"></div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


// ==========================
// 지도 생성
// ==========================


const map=L.map("map",{

minZoom:2,

maxZoom:6,

zoomControl:true

});


map.setView([20,0],2);



// ==========================
// 흰색 바다
// ==========================


L.rectangle(

[[-90,-180],[90,180]],

{

fillColor:"#ffffff",

fillOpacity:1,

stroke:false

}

).addTo(map);



// ==========================
// 대륙 표시
// 하늘색
// ==========================


const countryURL=

"https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";



fetch(countryURL)

.then(res=>res.json())

.then(data=>{


L.geoJSON(data,{

style:{


color:"#333",

weight:1,


fillColor:"#87CEEB",


fillOpacity:1


}


}).addTo(map);


});


// ==========================
// 판 경계 표시
// 빨간색 점선
// ==========================


const plateURL =

"https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_boundaries.json";



fetch(plateURL)

.then(res=>res.json())

.then(data=>{


L.geoJSON(data,{

style:{


color:"red",

weight:2,

dashArray:"10,10",

opacity:0.9


}


}).addTo(map);


});




// ==========================
// 지진 데이터
// ==========================


let quakeLayers=[];




async function loadEarthquakes(){



document.getElementById("list").innerHTML=

"불러오는 중...";



// 기존 지진 제거

quakeLayers.forEach(layer=>{

map.removeLayer(layer);

});


quakeLayers=[];




const url=

"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson";



const response=

await fetch(url);



const data=

await response.json();




const earthquakes=data.features;



// 규모 큰 순서

earthquakes.sort((a,b)=>{


return b.properties.mag-a.properties.mag;


});





const list=document.getElementById("list");


list.innerHTML="";




earthquakes.forEach(eq=>{


const mag=

eq.properties.mag;



const place=

eq.properties.place;



const time=

new Date(eq.properties.time);



const lat=

eq.geometry.coordinates[1];


const lon=

eq.geometry.coordinates[0];


const depth=

eq.geometry.coordinates[2];




// 색상 결정


let color="green";


if(mag>=4)

color="yellow";


if(mag>=5)

color="orange";


if(mag>=6)

color="red";





// 지도 점 표시


const marker=L.circleMarker(

[lat,lon],

{


radius:Math.max(5,mag*3),


color:color,


fillColor:color,


fillOpacity:0.8,


weight:2


}

).addTo(map);





marker.bindPopup(`


<h3>

규모 M${mag}

</h3>


위치 :

${place}


<br><br>


깊이 :

${depth.toFixed(1)} km


<br><br>


시간 :

${time.toUTCString()}


<br><br>


<a href="${eq.properties.url}"

target="_blank">

USGS 상세 자료 보기

</a>


`);




quakeLayers.push(marker);





// 왼쪽 목록 생성


const item=document.createElement("div");


item.className="event";



item.innerHTML=

`

<div class="mag">

M ${mag}

</div>


<div class="place">

${place}

</div>


<div class="time">

${time.toLocaleString()}

</div>


`;




item.onclick=function(){


map.flyTo(

[lat,lon],

5,

{

duration:1

}

);



marker.openPopup();


};



list.appendChild(item);



});



}



// 최초 실행

loadEarthquakes();




// 60초마다 갱신

setInterval(

loadEarthquakes,

60000

);

    
// ==========================
// 지도 확대 제한 보완
// ==========================


map.on("zoomend",function(){


if(map.getZoom()>6){


map.setZoom(6);


}


});




// ==========================
// 모바일 화면 대응
// ==========================


function resizeMap(){


map.invalidateSize();


}



window.addEventListener(

"resize",

resizeMap

);



// ==========================
// 시작 위치
// ==========================


map.setView(

[20,0],

2

);



</script>


</body>

</html>
