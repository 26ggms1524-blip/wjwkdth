<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Real Time Earthquake Monitor</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" 
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
}


#map{
    position:absolute;
    left:330px;
    right:0;
    top:0;
    bottom:0;
}


#panel{

    position:absolute;
    left:0;
    top:0;
    width:330px;
    height:100vh;

    background:#111827;
    color:white;

    overflow-y:auto;

    padding:15px;

    z-index:1000;

}


#panel h2{

    margin:0 0 10px 0;

    font-size:20px;

}


.info{

    font-size:13px;

    color:#9ca3af;

    margin-bottom:15px;

}


.event{

    background:#1f2937;

    border-radius:8px;

    padding:12px;

    margin-bottom:10px;

    cursor:pointer;

    transition:.2s;

}


.event:hover{

    background:#374151;

}


.mag{

    font-size:20px;

    font-weight:bold;

}


.time{

    color:#9ca3af;

    font-size:12px;

}


.place{

    margin-top:5px;

    font-size:13px;

}


button{

    width:100%;

    background:#2563eb;

    border:0;

    color:white;

    padding:8px;

    border-radius:5px;

    cursor:pointer;

}


.leaflet-popup-content{

    font-size:14px;

}



</style>

</head>


<body>


<div id="panel">

<h2>🌍 실시간 지진</h2>

<div class="info">
최근 24시간<br>
USGS 실시간 데이터
</div>


<button onclick="loadEarthquakes()">
새로고침
</button>


<hr>


<div id="list">

불러오는 중...

</div>


</div>



<div id="map"></div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script>


// 지도 설정

const map = L.map("map",{

    minZoom:2,

    maxZoom:6,

    zoomControl:true

}).setView([20,0],2);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

    maxZoom:6,

    attribution:"© OpenStreetMap"

}

).addTo(map);



let markers=[];




function clearMarkers(){

    markers.forEach(m=>map.removeLayer(m));

    markers=[];

}




async function loadEarthquakes(){


document.getElementById("list").innerHTML=
"불러오는 중...";


clearMarkers();



const url = 
"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson";



const data = await fetch(url).then(r=>r.json());



let list=document.getElementById("list");

list.innerHTML="";



let earthquakes=data.features;



// 규모 큰 순서

earthquakes.sort(
(a,b)=>
b.properties.mag-a.properties.mag
);



earthquakes.forEach(eq=>{


const mag=eq.properties.mag;

const place=eq.properties.place;

const time=new Date(
eq.properties.time
);


const lat=eq.geometry.coordinates[1];

const lon=eq.geometry.coordinates[0];

const depth=
eq.geometry.coordinates[2];



let color="#22c55e";


if(mag>=4) color="#facc15";

if(mag>=5) color="#fb923c";

if(mag>=6) color="#ef4444";



let marker=L.circleMarker(

[lat,lon],

{

radius:Math.max(mag*3,5),

color:color,

fillColor:color,

fillOpacity:.7

}

).addTo(map);



marker.bindPopup(`

<b>규모 M${mag}</b><br>

${place}<br><br>

깊이 : ${depth.toFixed(1)} km<br>

시간 : ${time.toUTCString()}<br><br>

<a href="${eq.properties.url}" target="_blank">

USGS 상세자료 보기

</a>

`);




markers.push(marker);





let item=document.createElement("div");

item.className="event";



item.innerHTML=

`

<div class="mag">

M ${mag}

</div>


<div class="place">

${place}

</div>


<div class="time">

${time.toLocaleString()}

</div>


`;



item.onclick=function(){

map.setView(

[lat,lon],

5

);

marker.openPopup();

};



list.appendChild(item);



});



}




loadEarthquakes();



setInterval(

loadEarthquakes,

60000

);



</script>

    <!-- 2/2 -->

<style>

@media(max-width:700px){

#panel{

width:100%;
height:40%;
bottom:0;
top:auto;

}

#map{

left:0;
top:0;
height:60%;

}

}

</style>


<script>


// 지도 이동 시 줌 제한 유지

map.on("zoomend",function(){

if(map.getZoom()>6){

map.setZoom(6);

}

});


// 지진 점 강조 기능

function focusEarthquake(lat,lon){

map.flyTo(

[lat,lon],

6,

{

duration:1

}

);

}


// ==============================
// 반도 / 주요 지형 경계 표시
// ==============================


const peninsulaStyle = {

    color:"#00ffff",

    weight:2,

    fillColor:"#00ffff",

    fillOpacity:0.08

};



const peninsulas = {

"type":"FeatureCollection",

"features":[


{
"type":"Feature",

"properties":{
"name":"한반도"
},

"geometry":{

"type":"Polygon",

"coordinates":[[

[124,39],
[126,42],
[130,42],
[130,34],
[126,34],
[124,39]

]]

}

},


{
"type":"Feature",

"properties":{
"name":"아라비아 반도"
},

"geometry":{

"type":"Polygon",

"coordinates":[[

[35,30],
[56,30],
[55,12],
[42,12],
[35,30]

]]

}

},


{
"type":"Feature",

"properties":{
"name":"인도 반도"
},

"geometry":{

"type":"Polygon",

"coordinates":[[

[68,23],
[88,22],
[80,7],
[72,10],
[68,23]

]]

}

},


{
"type":"Feature",

"properties":{
"name":"이베리아 반도"
},

"geometry":{

"type":"Polygon",

"coordinates":[

[
[-10,44],
[4,44],
[3,36],
[-9,36],
[-10,44]
]

]

}

},


{
"type":"Feature",

"properties":{
"name":"스칸디나비아 반도"
},

"geometry":{

"type":"Polygon",

"coordinates":[

[
[5,60],
[30,70],
[25,55],
[10,55],
[5,60]
]

]

}

}


]

};



L.geoJSON(

peninsulas,

{

style:peninsulaStyle,


onEachFeature:function(feature,layer){

layer.bindTooltip(

feature.properties.name

);

}

}

).addTo(map);


    
</script>


</body>

</html>
