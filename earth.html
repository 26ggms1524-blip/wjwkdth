<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>Earthquake Live Monitor</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

html,body{

margin:0;
padding:0;
height:100%;
overflow:hidden;
font-family:"Arial",sans-serif;

}


#map{

position:absolute;

left:330px;

top:0;

right:0;

bottom:0;

background:white;

}



#panel{

position:absolute;

left:0;

top:0;

width:330px;

height:100%;

background:#111827;

color:white;

padding:15px;

overflow-y:auto;

z-index:9999;

}



#panel h1{

margin:0;

font-size:22px;

}


.info{

margin-top:10px;

font-size:13px;

color:#cbd5e1;

line-height:1.6;

}


button{

margin-top:15px;

width:100%;

padding:10px;

border:none;

border-radius:6px;

background:#2563eb;

color:white;

cursor:pointer;

}


button:hover{

background:#1d4ed8;

}



.event{

background:#1f2937;

padding:12px;

margin-top:10px;

border-radius:8px;

cursor:pointer;

}



.event:hover{

background:#374151;

}



.mag{

font-size:21px;

font-weight:bold;

}



.place{

font-size:13px;

margin-top:5px;

}



.time{

font-size:12px;

color:#9ca3af;

margin-top:5px;

}



</style>


</head>


<body>



<div id="panel">


<h1>
🌎 Earth Monitor
</h1>


<div class="info">

🌊 바다 : 흰색<br>

🌍 대륙 : 하늘색<br>

🔴 판 경계 : 빨간 점선<br>

📡 USGS 실시간 지진

</div>


<button onclick="loadEarthquakes()">

새로고침

</button>


<hr>


<div id="list">

지진 데이터 준비중...

</div>


</div>




<div id="map"></div>




<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script>


// =======================
// 지도 생성
// =======================


const map=L.map("map",{


minZoom:2,

maxZoom:6,

zoomControl:true


});



map.setView(

[20,0],

2

);



// =======================
// 흰색 바다 배경
// =======================


L.rectangle(

[[-90,-180],[90,180]],

{

fillColor:"#ffffff",

fillOpacity:1,

stroke:false

}

).addTo(map);





// =======================
// 대륙 표시
// 하늘색
// =======================


const landURL=

"https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";



fetch(landURL)

.then(res=>res.json())

.then(data=>{


L.geoJSON(data,{


style:{


color:"#333333",

weight:1,


fillColor:"#87CEEB",

fillOpacity:1


}


}).addTo(map);


});

    
// =======================
// 판 경계 표시
// 빨간 점선
// =======================


const plateURL =

"https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_boundaries.json";



fetch(plateURL)

.then(res=>res.json())

.then(data=>{


L.geoJSON(data,{

style:{


color:"red",

weight:2,

dashArray:"8,8",

opacity:0.9


}


}).addTo(map);


});





// =======================
// 지역명 한국어 변환
// =======================


function koreanPlace(place){


let p=place;



const words={


"Japan":"일본",

"South Korea":"대한민국",

"North Korea":"북한",

"China":"중국",

"Taiwan":"대만",

"Philippines":"필리핀",

"Indonesia":"인도네시아",

"Russia":"러시아",

"Alaska":"알래스카",

"California":"캘리포니아",

"Hawaii":"하와이",

"Chile":"칠레",

"Mexico":"멕시코",

"Turkey":"튀르키예",

"Iran":"이란",

"India":"인도",

"Pakistan":"파키스탄",

"Afghanistan":"아프가니스탄",

"Greece":"그리스",

"Italy":"이탈리아",

"New Zealand":"뉴질랜드",

"Australia":"호주",

"Canada":"캐나다",

"United States":"미국"


};



// 국가명 변경


Object.keys(words).forEach(key=>{


p=p.replace(

key,

words[key]

);


});




// 방향 번역


p=p.replace(
" km NW of ",
" km 북서쪽 "
);


p=p.replace(
" km NE of ",
" km 북동쪽 "
);


p=p.replace(
" km SW of ",
" km 남서쪽 "
);


p=p.replace(
" km SE of ",
" km 남동쪽 "
);


p=p.replace(
" km N of ",
" km 북쪽 "
);


p=p.replace(
" km S of ",
" km 남쪽 "
);


p=p.replace(
" km E of ",
" km 동쪽 "
);


p=p.replace(
" km W of ",
" km 서쪽 "
);



return p;


}

    
// =======================
// 실시간 지진 데이터
// =======================


let quakeMarkers=[];



async function loadEarthquakes(){


const list=document.getElementById("list");


list.innerHTML="데이터 불러오는 중...";



// 기존 지진 제거

quakeMarkers.forEach(marker=>{


map.removeLayer(marker);


});


quakeMarkers=[];



// USGS 최근 24시간 데이터

const url=

"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson";



const response=await fetch(url);


const data=await response.json();



let earthquakes=data.features;



// =======================
// 시간 최신순 정렬
// =======================


earthquakes.sort((a,b)=>{


return b.properties.time - a.properties.time;


});




list.innerHTML="";





earthquakes.forEach(eq=>{


const mag=eq.properties.mag;


const place=koreanPlace(

eq.properties.place

);



const time=new Date(

eq.properties.time

);



const lat=

eq.geometry.coordinates[1];


const lon=

eq.geometry.coordinates[0];


const depth=

eq.geometry.coordinates[2];





// =======================
// 규모별 색상
// =======================


let color="#22c55e";



if(mag>=4){

color="#facc15";

}



if(mag>=5){

color="#fb923c";

}



if(mag>=6){

color="#ef4444";

}




// =======================
// 지도 지진 표시
// =======================


const marker=L.circleMarker(

[lat,lon],

{


radius:Math.max(5,mag*3),


color:color,


fillColor:color,


fillOpacity:0.8,


weight:2


}


).addTo(map);





marker.bindPopup(`


<h3>

규모 M${mag}

</h3>


<b>지역</b><br>

${place}


<br><br>


<b>깊이</b><br>

${depth.toFixed(1)} km


<br><br>


<b>발생시간</b><br>

${time.toLocaleString()}


<br><br>


<a href="${eq.properties.url}"

target="_blank">

USGS 상세 자료 보기

</a>


`);




quakeMarkers.push(marker);






// =======================
// 왼쪽 목록
// =======================


const item=document.createElement("div");


item.className="event";



item.innerHTML=`

<div class="mag">

M ${mag}

</div>


<div class="place">

${place}

</div>


<div class="time">

${time.toLocaleString()}

</div>

`;





item.onclick=function(){


map.flyTo(

[lat,lon],

5,

{

duration:1

}

);



marker.openPopup();



};





list.appendChild(item);



});



}



// 최초 실행

loadEarthquakes();



// 1분마다 자동 갱신

setInterval(

loadEarthquakes,

60000

);

    
// =======================
// 확대 제한
// =======================


map.on("zoomend",function(){


if(map.getZoom()>6){


map.setZoom(6);


}


});




// =======================
// 화면 크기 변경 대응
// =======================


window.addEventListener(

"resize",

function(){


map.invalidateSize();


}

);



// =======================
// 초기 위치
// =======================


map.setView(

[20,0],

2

);


</script>


</body>

</html>
