<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<title>
Earthquake Plate Monitor
</title>


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

html,body{

margin:0;
height:100%;
overflow:hidden;
font-family:Arial;

}


#map{

position:absolute;
left:330px;
right:0;
top:0;
bottom:0;
background:bule;

}



#panel{

position:absolute;

width:330px;

height:100%;

background:#111;

color:white;

padding:15px;

overflow-y:auto;

z-index:999;

}



h2{

margin-top:0;

}


.event{

background:#222;

padding:10px;

margin-bottom:8px;

border-radius:8px;

cursor:pointer;

}


.event:hover{

background:#444;

}


.mag{

font-size:20px;

font-weight:bold;

}


.place{

font-size:13px;

}



.time{

font-size:12px;

color:#aaa;

}



button{

width:100%;

padding:8px;

background:#c00;

color:white;

border:0;

border-radius:5px;

}



</style>

</head>


<body>


<div id="panel">

<h2>
🌎 Earth Monitor
</h2>


<button onclick="loadEarthquakes()">
새로고침
</button>


<hr>


<div id="list">

Loading...

</div>


</div>


<div id="map"></div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


// ==========================
// 지도 기본 설정
// ==========================


const map=L.map("map",{

minZoom:2,

maxZoom:6,

zoomControl:true

}).setView([20,0],2);




// ==========================
// 흰색 바다 배경
// ==========================


map.createPane("background");


map.getPane("background").style.zIndex=200;



L.rectangle(

[[-90,-180],[90,180]],

{

pane:"background",

fillColor:"white",

fillOpacity:1,

stroke:false

}

).addTo(map);



// ==========================
// 대륙 데이터
// ==========================


const landURL=
"https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";



fetch(landURL)

.then(r=>r.json())

.then(data=>{


L.geoJSON(data,{

style:{

color:"#000",

weight:1,

fillColor:"#000",

fillOpacity:1

}


}).addTo(map);


});



// ==========================
// 판 경계 데이터
// ==========================


const plateURL=

"https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_boundaries.json";



fetch(plateURL)

.then(r=>r.json())

.then(data=>{


L.geoJSON(data,{

style:{


color:"red",

weight:2,

dashArray:"8,8"


}


}).addTo(map);


});
// ==========================
// 실시간 지진 데이터
// ==========================


let quakeMarkers=[];


async function loadEarthquakes(){


document.getElementById("list").innerHTML=
"불러오는 중...";



// 기존 점 제거

quakeMarkers.forEach(m=>{

map.removeLayer(m);

});

quakeMarkers=[];



const url=

"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson";



const data=await fetch(url).then(r=>r.json());



let list=document.getElementById("list");

list.innerHTML="";



let quakes=data.features;



// 규모순 정렬

quakes.sort((a,b)=>{

return b.properties.mag-a.properties.mag;

});




quakes.forEach(q=>{


const mag=q.properties.mag;


const place=q.properties.place;


const time=new Date(
q.properties.time
);


const lat=q.geometry.coordinates[1];

const lon=q.geometry.coordinates[0];

const depth=q.geometry.coordinates[2];




// 규모별 색상

let color="lime";


if(mag>=4)
color="yellow";


if(mag>=5)
color="orange";


if(mag>=6)
color="red";





let marker=L.circleMarker(

[lat,lon],

{

radius:Math.max(5,mag*3),

color:color,

fillColor:color,

fillOpacity:0.8,

weight:2

}

).addTo(map);




marker.bindPopup(`


<h3>

규모 M${mag}

</h3>


<b>위치</b><br>

${place}

<br><br>


<b>깊이</b>

${depth.toFixed(1)} km

<br><br>


<b>발생시간</b>

${time.toUTCString()}


<br><br>


<a href="${q.properties.url}"

target="_blank">

USGS 상세 자료 보기

</a>


`);




quakeMarkers.push(marker);




// 왼쪽 목록 생성


let item=document.createElement("div");


item.className="event";


item.innerHTML=`

<div class="mag">

M ${mag}

</div>


<div class="place">

${place}

</div>


<div class="time">

${time.toLocaleString()}

</div>

`;



item.onclick=function(){


map.flyTo(

[lat,lon],

5,

{

duration:1

}

);


marker.openPopup();


};



list.appendChild(item);



});



}




// 실행

loadEarthquakes();



// 1분마다 갱신

setInterval(

loadEarthquakes,

60000

);



</script>


</body>

</html>
