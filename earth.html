<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Seismograph Simulation</title>
    <style>
        /* 레트로 픽셀 웹폰트 로드 */
        @import url('https://jsdelivr.net');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #1a1c2e, #393e46);
            font-family: 'DungGeunMo', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* 메인 메뉴 테마와 통일감을 주는 상단 HUD 영역 */
        .hud-container {
            width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            z-index: 10;
        }

        .hud-title {
            color: #ffeaa7;
            font-size: 1.4rem;
            text-shadow: 2px 2px 0px #2d3436;
        }

        /* 입체 모션이 적용된 메인 메뉴 복귀 버튼 */
        .exit-btn {
            background-color: #ee5253;
            color: white;
            border: 3px solid #000;
            box-shadow: 0px 4px 0px #b33939, 3px 6px 0px #000;
            padding: 6px 14px;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: 'DungGeunMo', monospace;
            position: relative;
        }
        .exit-btn:hover {
            background-color: #ff7979;
            box-shadow: 0px 3px 0px #b33939, 3px 5px 0px #000;
            transform: translateY(1px);
        }
        .exit-btn:active {
            box-shadow: 0px 0px 0px #000, 1px 1px 0px #000;
            transform: translateY(4px) translateX(1px);
        }

        /* 8비트 기기 본체 스크린 컨테이너 (메인 메뉴와 완벽 일치하는 600x400 규격) */
        .monitor-container {
            position: relative;
            width: 600px;
            height: 400px;
            background-color: #1e272e; /* 계측기 내부 어두운 사연 필터 */
            border: 6px solid #ff6b81; /* 레트로 네온 핑크 테두리 */
            box-shadow: 0px 0px 20px rgba(255, 107, 129, 0.4), 12px 12px 0px #1e2124;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* 브라운관 주사선 격자 무늬 텍스처 */
        .monitor-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.04) 2px, transparent 0),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 2px, transparent 0);
            background-size: 16px 16px;
            pointer-events: none;
            z-index: 10;
        }

        /* 상단 시스템 텍스트 라인 */
        .monitor-header {
            color: #2ecc71; /* 네온 그린 폰트 효과 */
            font-size: 1.2rem;
            border-bottom: 2px dashed #2ecc71;
            padding-bottom: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
        }

        /* 지진파가 그려지는 전용 오실로스코프 블랙 박스 */
        .graph-area {
            width: 100%;
            height: 200px;
            background-color: #05070a;
            border: 3px solid #2d3436;
            position: relative;
            overflow: hidden;
        }

        #seismicCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 하단 진도(규모) 조절 오락기 노브 버튼 랙 */
        .control-panel {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 5;
        }

        .panel-label {
            color: #74b9ff; /* 청량한 소다 블루 라벨 */
            font-size: 1.2rem;
            text-shadow: 1px 1px 0px #000;
        }

        .mag-btn-group {
            display: flex;
            gap: 8px;
        }

        /* 진도 변경용 입체 미니 사각 샌드 버튼 */
        .mag-btn {
            background-color: #3f4448;
            color: #b2bec3;
            border: 2px solid #000;
            box-shadow: 0px 3px 0px #23272a;
            padding: 6px 12px;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'DungGeunMo', monospace;
        }
        .mag-btn:hover { background-color: #4b5156; color: #fff; }
        
        /* 현재 활성화된 진도 등급 버튼 하이라이트 전광판 효과 */
        .mag-btn.active {
            background-color: #ffeaa7;
            color: #2d3436;
            box-shadow: 0px 1px 0px #000;
            transform: translateY(2px);
            font-weight: bold;
            border-color: #000;
        }

        .status-footer {
            margin-top: 8px;
            color: #888;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- 상단 복귀 헤더 바 구역 -->
    <div class="hud-container">
        <div class="hud-title">📡 SEISMIC WAVE ANALYZER</div>
        <!-- 💡 클릭 시 메인 메뉴인 main.html 파일로 되돌아갑니다 -->
        <button class="exit-btn" onclick="window.location.href='main.html'">메뉴로 나가기</button>
    </div>

    <!-- 모니터 계측기 본체 메인 스크린 -->
    <div class="monitor-container">
        
        <div class="monitor-header">
            <span>[MODELING: ACTIVE WAVE v1.2]</span>
            <span id="recLight" style="color: #ff3838; animation: blink 0.6s steps(2) infinite;">● SIMULATION</span>
        </div>

        <!-- 8비트 그래프 드로잉 구역 -->
        <div class="graph-area">
            <canvas id="seismicCanvas"></canvas>
        </div>

        <!-- 하단 조작용 아케이드 패널 컨트롤 가이드 -->
        <div class="control-panel">
            <span class="panel-label">MAGNITUDE DIAL :</span>
            <div class="mag-btn-group">
                <button class="mag-btn" onclick="setMagnitude(2, this)">M 2.0</button>
                <button class="mag-btn active" onclick="setMagnitude(4.5, this)">M 4.5</button>
                <button class="mag-btn" onclick="setMagnitude(7.2, this)">M 7.2</button>
            </div>
        </div>

        <div class="status-footer">
            <span id="waveTypeDisplay">CURRENT STATUS: MONITORING P-S WAVE</span>
            <span>FREQ: 60Hz</span>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('seismicCanvas');
        const ctx = canvas.getContext('2d');
        const waveTypeDisplay = document.getElementById('waveTypeDisplay');
        const recLight = document.getElementById('recLight');

        let animationId;
        let graphX = 0;
        
        // 실시간 연동 진도 배율 변수 (기본 4.5)
        let magnitudeMultiplier = 4.5;

        function initCanvas() {
            // 부모 박스에 맞춰 해상도 동적 리사이징 크래시 방지
            canvas.width = canvas.offsetWidth || 554;
            canvas.height = canvas.offsetHeight || 200;
            
            ctx.fillStyle = '#05070a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            graphX = 0;
        }

        // --- 실시간 8비트 주파수 수식 드로잉 루프 알고리즘 ---
        function drawSeismograph() {
            // 스크린 우측 끝에 도달하면 화면 청소 후 왼쪽에서 재출발 무한 루프
            if (graphX >= canvas.width) {
                ctx.fillStyle = '#05070a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                graphX = 0;
            }

            // 고전 계측기 특유의 오프셋 기준 중앙 평행선 레이아웃 라인
            const centerY = canvas.height / 2;

            ctx.strokeStyle = '#2ecc71'; // 사이버 네온 그린 레이어 스티치 색상
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(graphX, centerY);

            // 1. 기본 마이크로 진동 백그라운드 노이즈 수학 연산
            let backgroundNoise = (Math.random() - 0.5) * (magnitudeMultiplier * 2.5);

            // 2. 가상 지반 단층 파괴 물리식(P파/S파 주기 삼각함수 중첩) 시뮬레이션
            let seismicShock = Math.sin(graphX * 0.15) * (Math.random() * (magnitudeMultiplier * 11)) * Math.sin(Date.now() * 0.006);

            // 두 파형을 합성하여 가로 2픽셀 단위로 선을 엮어 드로잉 진행
            let finalY = centerY + backgroundNoise + seismicShock;

            // 계측 범위 상하단 임계값 이탈 방지 가드 클리핑 예외 처리
            if(finalY < 10) finalY = 10;
            if(finalY > canvas.height - 10) finalY = canvas.height - 10;

            ctx.lineTo(graphX + 2, finalY);
            ctx.stroke();

            graphX += 2; // 우측으로 2픽셀씩 전진 전개
            animationId = requestAnimationFrame(drawSeismograph);
        }

        // --- 진도 스위칭 인터랙션 제어 인터페이스 함수 ---
        function setMagnitude(mag, buttonElement) {
            magnitudeMultiplier = mag;

            // 기존 액티브 클래스 지우고 현재 버튼 활성화 전광판 불 켜기
            const buttons = document.querySelectorAll('.mag-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            // 규모에 따른 경고 전광판 푸터 상태 메시지 분기 갱신
            if (mag <= 2.0) {
                waveTypeDisplay.innerText = "CURRENT STATUS: MICRO SEISMIC ACTIVITY";
                recLight.style.color = "#2ecc71"; // 진도가 약할 땐 초록불
            } else if (mag <= 4.5) {
                waveTypeDisplay.innerText = "CURRENT STATUS: MONITORING P-S WAVE";
                recLight.style.color = "#ff3838"; // 평시에는 빨간 경고불
            } else {
                waveTypeDisplay.innerText = "⚠️ ALERT: MAJOR FAULT RUPTURE SIMULATION";
                recLight.style.color = "#ff9f43"; // 강한 진도 발생 시 주황 경보등 교체
            }
        }

        // 브라우저 초기화 및 가동 시동 트리거 온
        window.addEventListener('DOMContentLoaded', () => {
            initCanvas();
            drawSeismograph();
        });
    </script>
</body>
</html>
