<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Soda - 90's Retro Taste</title>
    <style>
        /* Import retro pixel web font (Fixed CDN URL) */
        @import url('https://jsdelivr.net');
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #a1c4fd, #c2e9fb);
            font-family: 'DungGeunMo', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- 8-bit Pixel Cloud Background Effect --- */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            
            /* Crisply aligned horizontal/vertical pixel graphic combinations */
            background-image: 
                /* First large cloud layer */
                linear-gradient(90deg, rgba(255,255,255,0.6) 80px, transparent 0),
                linear-gradient(rgba(255,255,255,0.6) 30px, transparent 0),
                /* Second small cloud layer */
                linear-gradient(90deg, rgba(255,255,255,0.4) 50px, transparent 0),
                linear-gradient(rgba(255,255,255,0.4) 20px, transparent 0),
                /* Added 8-bit pixel grid texture layer */
                linear-gradient(rgba(255, 255, 255, 0.15) 4px, transparent 0),
                linear-gradient(90deg, rgba(255, 255, 255, 0.15) 4px, transparent 0);
                
            /* Standardized background size for perfect pixel grid snapping */
            background-size: 240px 160px, 240px 160px, 160px 100px, 160px 100px, 8px 8px, 8px 8px;
            background-position: 40px 20%, 40px 20%, 120px 55%, 120px 55%, 0 0, 0 0;
            
            /* Smooth horizontal floating animation */
            animation: floatClouds 25s linear infinite;
            z-index: 1;
        }

        @keyframes floatClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 슬라임이 밀 때 함께 밀려 나갈 컨테이너 박스 */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            border: 4px solid #2d3436;
            box-shadow: 8px 8px 0px #2d3436;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 2;
        }
        h1 {
            color: #ff6b81;
            font-size: 3rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0px #ffeaa7;
        }
        p {
            color: #2d3436;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 35px;
            font-style: italic; 
        }
        .btn {
            background-color: #74b9ff;
            color: white;
            padding: 12px 24px;
            font-size: 1.4rem;
            border: 3px solid #2d3436;
            box-shadow: 4px 4px 0px #2d3436;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            font-family: 'DungGeunMo', monospace;
            transition: none; 
        }
        .btn:hover {
            background-color: #0984e3;
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #2d3436;
        }
        .btn:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px #2d3436;
        }

        /* --- 박스가 밀려나가는 애니메이션 속도 제어 --- */
        .slide-out {
            /* ⏱️ 슬라임 속도에 맞춰 박스 밀리는 속도도 1.4초로 천천히 연장했습니다 */
            animation: slideLeftMove 1.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
        }
        @keyframes slideLeftMove {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(-120vw); opacity: 0; }
        }

        /* --- ✨ 밀어서 잠금해제하는 슬라임 캐릭터 디자인 --- */
        .push-slime {
            position: fixed;
            bottom: 20%;
            right: -60px; 
            width: 48px;
            height: 40px;
            background-color: #a8e6cf;
            border: 4px solid #000;
            border-radius: 4px;
            box-shadow: inset -6px -6px 0px #81c784;
            z-index: 9999;
            display: none;
        }
        /* 슬라임 눈동자 설정 */
        .push-slime::before {
            content: "";
            position: absolute;
            top: 10px;
            left: 8px; 
            width: 6px;
            height: 6px;
            background-color: #000;
            box-shadow: 14px 0px #000;
        }

        /* 슬라임이 뽈뽈뽈 왼쪽으로 돌진하며 밀어버리는 애니메이션 */
        .slime-charge {
            display: block !important;
            animation: 
                slimeWalkLoop 0.18s infinite alternate, /* 발걸음 속도도 조금 더 여유롭게 조정 */
                slimePushLeft 1.6s linear forwards;    /* ⏱️ 이동 총 시간을 0.8초에서 1.6초로 대폭 늘려 천천히 가도록 바꿨습니다 */
        }

        /* 쿵쾅쿵쾅 뛰는 도트 애니메이션 */
        @keyframes slimeWalkLoop {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(0.85) translateY(2px); }
        }
        /* 오른쪽에서 왼쪽으로 화면 전체를 돌파하는 애니메이션 */
        @keyframes slimePushLeft {
            0% { right: -60px; }
            100% { right: 110vw; }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>☁️ Welcome! 🥤</h1>
        <p>A sweet sip of the sky, a taste of nostalgia.<br> cms.</p>
        <a href="#" id="enterBtn" class="btn">ENTER</a>
    </div>

    <!-- 화면을 밀어버릴 귀여운 슬라임 오브젝트 -->
    <div id="pushSlime" class="push-slime"></div>

    <script>
        document.getElementById('enterBtn').addEventListener('click', function(e) {
            e.preventDefault(); 
            
            const container = document.getElementById('mainContainer');
            const slime = document.getElementById('pushSlime');

            // 1. 슬라임 소환 후 왼쪽으로 천천히 전진 가동
            slime.classList.add('slime-charge');

            // 2. ⏱️ 슬라임이 이동하는 속도가 느려졌으므로, 박스에 도달하는 타이밍인 0.4초(400ms) 뒤에 컨테이너가 밀리도록 수정했습니다.
            setTimeout(() => {
                container.classList.add('slide-out');
            }, 400);

            // 3. ⏱️ 슬라임이 화면 끝까지 다 밀고 나가는 총 1.6초(1600ms) 시점에 다음 화면 파일로 이동하게 설정했습니다.
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 1600);
        });
    </script>
</body>
</html>
