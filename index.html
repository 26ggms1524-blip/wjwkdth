<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Soda - 90's Retro Taste</title>
    <style>
        /* Import retro pixel web font (Fixed CDN URL) */
        @import url('https://jsdelivr.net');
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #a1c4fd, #c2e9fb);
            font-family: 'DungGeunMo', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- 8-bit Pixel Cloud Background Effect --- */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            
            /* Crisply aligned horizontal/vertical pixel graphic combinations */
            background-image: 
                /* First large cloud layer */
                linear-gradient(90deg, rgba(255,255,255,0.6) 80px, transparent 0),
                linear-gradient(rgba(255,255,255,0.6) 30px, transparent 0),
                /* Second small cloud layer */
                linear-gradient(90deg, rgba(255,255,255,0.4) 50px, transparent 0),
                linear-gradient(rgba(255,255,255,0.4) 20px, transparent 0),
                /* Added 8-bit pixel grid texture layer */
                linear-gradient(rgba(255, 255, 255, 0.15) 4px, transparent 0),
                linear-gradient(90deg, rgba(255, 255, 255, 0.15) 4px, transparent 0);
                
            /* Standardized background size for perfect pixel grid snapping */
            background-size: 240px 160px, 240px 160px, 160px 100px, 160px 100px, 8px 8px, 8px 8px;
            background-position: 40px 20%, 40px 20%, 120px 55%, 120px 55%, 0 0, 0 0;
            
            /* Smooth horizontal floating animation */
            animation: floatClouds 25s linear infinite;
            z-index: 1;
        }

        @keyframes floatClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            border: 4px solid #2d3436;
            box-shadow: 8px 8px 0px #2d3436;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 2;
        }
        h1 {
            color: #ff6b81;
            font-size: 3rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0px #ffeaa7;
        }
        p {
            color: #2d3436;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 35px;
            font-style: italic; 
        }
        .btn {
            background-color: #74b9ff;
            color: white;
            padding: 12px 24px;
            font-size: 1.4rem;
            border: 3px solid #2d3436;
            box-shadow: 4px 4px 0px #2d3436;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            font-family: 'DungGeunMo', monospace;
            transition: none; 
        }
        .btn:hover {
            background-color: #0984e3;
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #2d3436;
        }
        .btn:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px #2d3436;
        }

        /* --- ✨ 귀여운 레트로 감성 지지직 필터 --- */
        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(0deg, rgba(255,255,255,0.2) 0px, rgba(255,255,255,0.2) 2px, transparent 2px, transparent 4px);
            z-index: 9999;
            display: none;
            pointer-events: none;
        }
        
        .glitch-active {
            display: block !important;
            animation: softNeonBlink 0.08s infinite;
        }
        .body-glitch {
            animation: softBounce 0.06s infinite;
            filter: saturate(180%) contrast(110%);
        }

        @keyframes softNeonBlink {
            0% { background-color: rgba(255, 107, 129, 0.15); } 
            50% { background-color: rgba(116, 185, 255, 0.15); } 
            100% { background-color: rgba(255, 234, 167, 0.15); } 
        }
        @keyframes softBounce {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            100% { transform: translate(0px, 1px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☁️ Welcome! 🥤</h1>
        <p>A sweet sip of the sky, a taste of nostalgia.<br> cms.</p>
        <a href="#" id="enterBtn" class="btn">ENTER</a>
    </div>

    <div id="glitchOverlay" class="glitch-overlay"></div>

    <script>
        document.getElementById('enterBtn').addEventListener('click', function(e) {
            e.preventDefault(); 
            
            const overlay = document.getElementById('glitchOverlay');
            const body = document.body;

            overlay.classList.add('glitch-active');
            body.classList.add('body-glitch');

            // 0.3초(300ms) 후 main.html로 부드럽고 가볍게 전환
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 300);
        });
    </script>
</body>
</html>
