<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Soda - 90's Retro Taste</title>
    <style>
        /* Import retro pixel web font */
        @import url('https://jsdelivr.net');
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #a1c4fd, #c2e9fb);
            font-family: 'DungGeunMo', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- 8-bit Pixel Cloud Background Effect --- */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            /* Generated pixel clouds using CSS grids */
            background-image: 
                linear-gradient(rgba(255,255,255,0.6) 20px, transparent 0),
                linear-gradient(90deg, rgba(255,255,255,0.6) 60px, transparent 0),
                linear-gradient(rgba(255,255,255,0.4) 15px, transparent 0),
                linear-gradient(90deg, rgba(255,255,255,0.4) 40px, transparent 0);
            background-size: 200px 150px, 200px 150px, 130px 90px, 130px 90px;
            background-position: 0 20%, 0 20%, 50px 60%, 50px 60%;
            /* Smooth horizontal floating animation */
            animation: floatClouds 25s linear infinite;
            z-index: 1;
        }

        @keyframes floatClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            border: 4px solid #2d3436;
            box-shadow: 8px 8px 0px #2d3436;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 2;
        }
        h1 {
            color: #ff6b81;
            font-size: 3rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0px #ffeaa7;
        }
        p {
            color: #2d3436;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 35px;
            /* Applied italic styling for description text */
            font-style: italic; 
        }
        .btn {
            background-color: #74b9ff;
            color: white;
            padding: 12px 24px;
            font-size: 1.4rem;
            border: 3px solid #2d3436;
            box-shadow: 4px 4px 0px #2d3436;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            font-family: 'DungGeunMo', monospace;
            /* Instant response for arcade game aesthetic */
            transition: none; 
        }
        .btn:hover {
            background-color: #0984e3;
            /* Creates a crisp, heavy click motion */
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #2d3436;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. "환영합니다!"를 "Welcome!"으로 변경 -->
        <h1>☁️ Welcome! 🥤</h1>
        <!-- 2. "달콤한 하늘 한 모금..."을 영문 감성 문구로 변경 및 기울임꼴 유지 -->
        <p>A sweet sip of the sky, a taste of nostalgia.<br> cms.</p>
        <!-- 3. "입장하기"를 레트로 게임 스타일에 맞게 "ENTER"로 변경 -->
        <a href="#" class="btn">ENTER</a>
    </div>
</body>
</html>
