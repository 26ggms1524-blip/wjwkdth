<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Soda - 90's Retro Taste</title>
    <style>
        /* Import retro pixel web font (Fixed CDN URL) */
        @import url('https://jsdelivr.net');
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #a1c4fd, #c2e9fb);
            font-family: 'DungGeunMo', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- 8-bit Pixel Cloud Background Effect --- */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            
            /* Crisply aligned horizontal/vertical pixel graphic combinations */
            background-image: 
                /* First large cloud layer */
                linear-gradient(90deg, rgba(255,255,255,0.6) 80px, transparent 0),
                linear-gradient(rgba(255,255,255,0.6) 30px, transparent 0),
                /* Second small cloud layer */
                linear-gradient(90deg, rgba(255,255,255,0.4) 50px, transparent 0),
                linear-gradient(rgba(255,255,255,0.4) 20px, transparent 0),
                /* Added 8-bit pixel grid texture layer */
                linear-gradient(rgba(255, 255, 255, 0.15) 4px, transparent 0),
                linear-gradient(90deg, rgba(255, 255, 255, 0.15) 4px, transparent 0);
                
            /* Standardized background size for perfect pixel grid snapping */
            background-size: 240px 160px, 240px 160px, 160px 100px, 160px 100px, 8px 8px, 8px 8px;
            background-position: 40px 20%, 40px 20%, 120px 55%, 120px 55%, 0 0, 0 0;
            
            /* Smooth horizontal floating animation */
            animation: floatClouds 25s linear infinite;
            z-index: 1;
        }

        @keyframes floatClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            border: 4px solid #2d3436;
            box-shadow: 8px 8px 0px #2d3436;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 2;
        }
        h1 {
            color: #ff6b81;
            font-size: 3rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0px #ffeaa7;
        }
        p {
            color: #2d3436;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 35px;
            /* Applied italic styling for description text */
            font-style: italic; 
        }
        .btn {
            background-color: #74b9ff;
            color: white;
            padding: 12px 24px;
            font-size: 1.4rem;
            border: 3px solid #2d3436;
            box-shadow: 4px 4px 0px #2d3436;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            font-family: 'DungGeunMo', monospace;
            /* Instant response for arcade game aesthetic */
            transition: none; 
        }
        .btn:hover {
            background-color: #0984e3;
            /* Creates a crisp, heavy click motion */
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #2d3436;
        }
        /* 추가 코드: 마우스 클릭 유지 시 완전히 아래로 내려앉는 아케이드 입력 모션 */
        .btn:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px #2d3436;
        }

        /* --- [추가된 디자인] 레드로 브라운관 지지직 노이즈 스크린 필터 --- */
        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 2px, transparent 2px, transparent 4px);
            background-color: rgba(255, 255, 255, 0.25);
            z-index: 9999;
            display: none;
            pointer-events: none;
        }
        
        /* 스크린 트리거 가동 인터페이스 */
        .glitch-active {
            display: block !important;
            animation: tvStatic 0.12s infinite;
        }
        .body-glitch {
            animation: screenShake 0.08s infinite;
            filter: contrast(160%) brightness(130%) hue-rotate(60deg);
        }

        @keyframes tvStatic {
            0% { background-position: 0 0; background-color: rgba(255,255,255,0.4); }
            50% { background-position: 4px 8px; background-color: rgba(0,0,0,0.25); }
            100% { background-position: -4px -8px; background-color: rgba(255,255,255,0.3); }
        }
        @keyframes screenShake {
            0% { transform: translate(3px, 2px) skew(1.5deg); }
            50% { transform: translate(-2px, -3px) skew(-1.5deg); }
            100% { transform: translate(1px, 3px) skew(0deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. "환영합니다!" changed to "Welcome!" -->
        <h1>☁️ Welcome! 🥤</h1>
        <!-- 2. Emotional phrase with italic styling preserved -->
        <p>A sweet sip of the sky, a taste of nostalgia.<br> cms.</p>
        <!-- 3. Retro arcade style "ENTER" button (스크립트 인터셉트를 위해 id="enterBtn" 지정) -->
        <a href="#" id="enterBtn" class="btn">ENTER</a>
    </div>

    <!-- [추가된 레이아웃] 지지직 오버레이 스크린 도프 -->
    <div id="glitchOverlay" class="glitch-overlay"></div>

    <!-- [추가된 스크립트] 0.5초 타이머 연동 및 메인 화면 점프 엔진 -->
    <script>
        document.getElementById('enterBtn').addEventListener('click', function(e) {
            e.preventDefault(); // 하이퍼링크 기본 즉시 이동 성질 제한
            
            const overlay = document.getElementById('glitchOverlay');
            const body = document.body;

            // 지지직 노이즈 필터 및 쉐이크 애니메이션 작동 클래스 주입
            overlay.classList.add('glitch-active');
            body.classList.add('body-glitch');

            // 0.5초(500ms) 동안 화면 요동 연출 후 세 가지 목록을 설계했던 main.html로 부드럽게 점프
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 500);
        });
    </script>
</body>
</html>
