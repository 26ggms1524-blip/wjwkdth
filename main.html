<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade - Main Menu</title>
    <style>
        /* 레트로 픽셀 웹폰트 로드 */
        @import url('https://jsdelivr.net');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #1a1c2e, #393e46);
            font-family: 'DungGeunMo', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* 8비트 게임기 모니터 스타일 메인 캔버스 컨테이너 */
        .game-container {
            position: relative;
            width: 600px;
            height: 400px;
            background-color: #2d3436; /* 깊이감 있는 아케이드 딥 블랙 */
            border: 6px solid #ff6b81; /* 레트로 핑크 메탈릭 네온 테두리 */
            box-shadow: 0px 0px 20px rgba(255, 107, 129, 0.4), 12px 12px 0px #1e2124;
            overflow: hidden;
        }

        /* CRT 모니터 스타일의 미세한 도트 격자 텍스처 무늬 효과 */
        .game-container::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 2px, transparent 0),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 2px, transparent 0);
            background-size: 16px 16px;
            pointer-events: none;
            z-index: 10;
        }

        /* --- 메인 메뉴 스크린 레이아웃 --- */
        .menu-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .menu-title {
            color: #ffeaa7;
            font-size: 3rem;
            margin-bottom: 45px;
            letter-spacing: 2px;
            text-shadow: 4px 4px 0px #ff6b81, -2px -2px 0px #000;
            animation: pulse 1s infinite alternate;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 22px;
            width: 280px;
            z-index: 25;
        }

        /* ✨ 오락기 버튼처럼 더욱 입체적이고 화려하게 꾸며진 레트로 버튼 디자인 */
        .menu-item {
            background-color: #74b9ff;
            color: white;
            padding: 16px 20px;
            font-size: 1.5rem;
            text-align: center;
            border: 4px solid #000;
            box-shadow: 0px 6px 0px #0984e3, 4px 10px 0px #000;
            cursor: pointer;
            font-family: 'DungGeunMo', monospace;
            position: relative;
            transition: none; /* 칼 같은 도트 반응을 위해 트랜지션 제거 */
        }

        /* 마우스를 올렸을 때 반짝이는 일렉트릭 옐로우 폰트 스위치 효과 */
        .menu-item:hover {
            background-color: #0984e3;
            color: #ffeaa7;
            border-color: #000;
            box-shadow: 0px 4px 0px #054b82, 4px 8px 0px #000;
            transform: translateY(2px);
        }
        
        /* 마우스로 클릭했을 때 버튼 메커니즘이 깊숙이 들어가는 아케이드 액티브 터치 모션 */
        .menu-item:active {
            box-shadow: 0px 0px 0px #000, 2px 2px 0px #000;
            transform: translateY(6px) translateX(2px);
        }

        /* 2번 지진 모델링 버튼은 사이버네틱한 네온 그린 컬러 포인트로 커스텀 스타일링 */
        .seismic-btn {
            background-color: #1dd1a1;
            box-shadow: 0px 6px 0px #10ac84, 4px 10px 0px #000;
        }
        .seismic-btn:hover {
            background-color: #10ac84;
            box-shadow: 0px 4px 0px #0b775c, 4px 8px 0px #000;
        }

        /* --- 🤖 배경 공간을 뽈뽈 배회하는 AI 도트 슬라임 캐릭터 --- */
        .npc-pet {
            position: absolute;
            bottom: 35px;
            left: 100px;
            width: 32px;
            height: 26px;
            background-color: #a8e6cf;
            border: 3px solid #000;
            border-radius: 4px;
            box-shadow: inset -5px -5px 0px #81c784;
            z-index: 22;
            animation: slimeSquish 0.4s infinite alternate;
        }
        /* 귀여운 도트 눈동자 인자 레이아웃 */
        .npc-pet::before {
            content: "";
            position: absolute;
            top: 7px;
            right: 5px;
            width: 4px;
            height: 4px;
            background-color: #000;
            box-shadow: -10px 0px #000;
        }

        @keyframes slimeSquish { 0% { transform: scaleY(1); } 100% { transform: scaleY(0.82) translateY(3px); } }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.04); } }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- [메인 메뉴 레이어] -->
        <div class="menu-screen" id="menuScreen">
            <div class="menu-title">SELECT MENU</div>
            <div class="menu-list">
                <!-- 💡 1. 누르면 game.html 파일로 바로 점프 브라우징 이동 -->
                <div class="menu-item" onclick="window.location.href='game.html'">1. 도트 게임하기</div>
                <!-- 💡 2. 누르면 earth.html 파일로 바로 점프 브라우징 이동 -->
                <div class="menu-item seismic-btn" onclick="window.location.href='earth.html'">2. 지진 모델링</div>
            </div>
            
            <!-- 혼자 무대를 돌아다니며 분위기를 살려주는 슬라임 동료 -->
            <div class="npc-pet" id="menuPet"></div>
        </div>

    </div>

    <script>
        const menuPet = document.getElementById('menuPet');

        // 슬라임 캐릭터 패트롤 정밀 자바스크립트 인공지능 제어 루틴
        let petX = 120;
        let petDir = 1; // 1: 우측 전진, -1: 좌측 반전 전진
        const petSpeed = 1.3;

        function animationLoop() {
            petX += petSpeed * petDir;
            
            // 모니터 화면 경계선(600px) 벽에 닿기 직전에 스무스하게 쳐다보는 방향 전환
            if (petX > 530) {
                petDir = -1;
                menuPet.style.transform = 'scaleX(-1)'; // 왼쪽 바라보기
            } else if (petX < 35) {
                petDir = 1;
                menuPet.style.transform = 'scaleX(1)';  // 오른쪽 바라보기
            }
            
            menuPet.style.left = petX + 'px';
            requestAnimationFrame(animationLoop);
        }

        // 루프 가동 시작
        animationLoop();
    </script>
</body>
</html>
