<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade - Main Menu</title>
    <style>
        /* 레트로 픽셀 웹폰트 로드 */
        @import url('https://jsdelivr.net');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #1a1c2e, #393e46);
            font-family: 'DungGeunMo', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* 8비트 게임기 모니터 스타일 메인 캔버스 컨테이너 */
        .game-container {
            position: relative;
            width: 600px;
            height: 400px;
            /* 🌤️ 배경: 첫 화면과 같은 청량한 소다 하늘색 그라디언트 */
            background: linear-gradient(to bottom, #a1c4fd, #c2e9fb); 
            border: 6px solid #ff6b81; /* 레트로 핑크 메탈릭 네온 테두리 */
            box-shadow: 0px 0px 20px rgba(255, 107, 129, 0.4), 12px 12px 0px #1e2124;
            overflow: hidden;
        }

        /* ☁️ 배경: 실시간으로 스무스하게 흐르는 레트로 도트 구름 레이어 */
        .game-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background-image: 
                linear-gradient(90deg, rgba(255,255,255,0.6) 80px, transparent 0),
                linear-gradient(rgba(255,255,255,0.6) 30px, transparent 0),
                linear-gradient(90deg, rgba(255,255,255,0.4) 50px, transparent 0),
                linear-gradient(rgba(255,255,255,0.4) 20px, transparent 0),
                linear-gradient(rgba(255, 255, 255, 0.15) 4px, transparent 0),
                linear-gradient(90deg, rgba(255, 255, 255, 0.15) 4px, transparent 0);
            background-size: 240px 160px, 240px 160px, 160px 100px, 160px 100px, 8px 8px, 8px 8px;
            background-position: 40px 20%, 40px 20%, 120px 55%, 120px 55%, 0 0, 0 0;
            animation: menuClouds 25s linear infinite;
            z-index: 1;
        }

        /* CRT 모니터 스타일 격자 텍스처 효과 */
        .game-container::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 2px, transparent 0),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 2px, transparent 0);
            background-size: 16px 16px;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes menuClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* --- 메인 메뉴 스크린 레이아웃 --- */
        .menu-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .menu-title {
            color: #ffffff;
            font-size: 3rem;
            margin-bottom: 45px;
            letter-spacing: 2px;
            text-shadow: 4px 4px 0px #ff6b81, -2px -2px 0px #2d3436;
            animation: pulse 1s infinite alternate;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 22px;
            width: 280px;
            z-index: 25;
        }

        /* 🎨 버튼 스타일 변경: 배경 무드와 통일감을 주는 딸기 핑크 룩 */
        .menu-item {
            background-color: #ff7979; 
            color: white;
            padding: 16px 20px;
            font-size: 1.5rem;
            text-align: center;
            border: 4px solid #2d3436;
            box-shadow: 0px 6px 0px #b33939, 4px 10px 0px #2d3436;
            cursor: pointer;
            font-family: 'DungGeunMo', monospace;
            position: relative;
            transition: none; 
        }

        .menu-item:hover {
            background-color: #ff5252;
            color: #ffeaa7; /* 호버 시 노란색 픽셀 포인트 불빛 */
            box-shadow: 0px 4px 0px #b33939, 4px 8px 0px #2d3436;
            transform: translateY(2px);
        }
        
        .menu-item:active {
            box-shadow: 0px 0px 0px #000, 2px 2px 0px #2d3436;
            transform: translateY(6px) translateX(2px);
        }

        /* 2번 지진 모델링 버튼은 소다 블루 컬러로 청량감 매칭 */
        .seismic-btn {
            background-color: #74b9ff;
            box-shadow: 0px 6px 0px #0984e3, 4px 10px 0px #2d3436;
        }
        .seismic-btn:hover {
            background-color: #0984e3;
            box-shadow: 0px 4px 0px #054b82, 4px 8px 0px #2d3436;
        }

        /* 🤖 화면 전체를 대각선으로 통통 자유자재 배회하는 슬라임 캐릭터 */
        .npc-pet {
            position: absolute;
            width: 32px;
            height: 26px;
            background-color: #a8e6cf;
            border: 3px solid #000;
            border-radius: 4px;
            box-shadow: inset -5px -5px 0px #81c784;
            z-index: 22;
            animation: slimeSquish 0.3s infinite alternate;
        }
        .npc-pet::before {
            content: "";
            position: absolute;
            top: 7px;
            right: 5px;
            width: 4px;
            height: 4px;
            background-color: #000;
            box-shadow: -10px 0px #000;
        }

        @keyframes slimeSquish { 0% { transform: scaleY(1); } 100% { transform: scaleY(0.82) translateY(2px); } }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.04); } }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- [메인 메뉴 레이어] -->
        <div class="menu-screen" id="menuScreen">
            <div class="menu-title">SELECT MENU</div>
            <div class="menu-list">
                <div class="menu-item" onclick="window.location.href='game.html'">1. 도트 게임하기</div>
                <div class="menu-item seismic-btn" onclick="window.location.href='earth.html'">2. 지진 모델링</div>
            </div>
            
            <!-- 사방을 자유자재로 돌아다니는 슬라임 캐릭터 -->
            <div class="npc-pet" id="menuPet"></div>
        </div>

    </div>

    <script>
        const menuPet = document.getElementById('menuPet');

        // ✨ 2D 자유 튕김 AI 엔진 변수 설정
        let petX = 120;
        let petY = 200;
        
        // 가로(X) 속도와 세로(Y) 속도를 다르게 주어 튕겨 다니도록 설정 (0.7 수준의 느긋한 속도)
        let vx = 0.7; 
        let vy = 0.4; 
        
        const petWidth = 32;
        const petHeight = 26;
        const containerWidth = 600;
        const containerHeight = 400;

        function animationLoop() {
            // 위치 업데이트
            petX += vx;
            petY += vy;
            
            // 1. 가로 벽 충돌 검사 및 좌우 시선 전환 연출
            if (petX + petWidth > containerWidth - 10) {
                vx = -vx;
                menuPet.style.transform = 'scaleX(-1)'; // 벽에 부딪히면 왼쪽 바라보기
            } else if (petX < 10) {
                vx = -vx;
                menuPet.style.transform = 'scaleX(1)';  // 벽에 부딪히면 오른쪽 바라보기
            }

            // 2. 세로 벽(천장과 바닥) 충돌 검사
            if (petY + petHeight > containerHeight - 15) {
                vy = -vy; // 바닥에 닿으면 튕겨 올라감
            } else if (petY < 15) {
                vy = -vy; // 천장에 닿으면 튕겨 내려옴
            }
            
            // 실시간 스타일 좌표 연동
            menuPet.style.left = petX + 'px';
            menuPet.style.top = petY + 'px';
            
            requestAnimationFrame(animationLoop);
        }

        // AI 가동 루프 시작
        animationLoop();
    </script>
</body>
</html>
