<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade - Main Menu</title>
    <style>
        /* 레트로 픽셀 웹폰트 로드 */
        @import url('https://jsdelivr.net');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #a1c4fd, #c2e9fb); 
            font-family: 'DungGeunMo', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        /* ☁️ 무한 루프 레트로 도트 구름 레이어 */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background-image: 
                linear-gradient(90deg, rgba(255,255,255,0.6) 80px, transparent 0),
                linear-gradient(rgba(255,255,255,0.6) 30px, transparent 0),
                linear-gradient(90deg, rgba(255,255,255,0.4) 50px, transparent 0),
                linear-gradient(rgba(255,255,255,0.4) 20px, transparent 0),
                linear-gradient(rgba(255, 255, 255, 0.15) 4px, transparent 0),
                linear-gradient(90deg, rgba(255, 255, 255, 0.15) 4px, transparent 0);
            background-size: 240px 160px, 240px 160px, 160px 100px, 160px 100px, 8px 8px, 8px 8px;
            background-position: 40px 20%, 40px 20%, 120px 55%, 120px 55%, 0 0, 0 0;
            animation: menuClouds 25s linear infinite;
            z-index: 1;
        }

        @keyframes menuClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 🕹️ 아케이드 기기 캐비닛 프레임 본체 하우징 */
        .arcade-cabinet {
            background: #2d3436; 
            border: 6px solid #ff6b81; /* 본체 마감 핑크 라인 테두리 */
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 15px 0px #1e2124, 0px 0px 30px rgba(255, 107, 129, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        /* 📺 오락기 CRT 브라운관 스크린 튜브 뷰포트 박스 */
        .game-container {
            position: relative;
            width: 540px;
            height: 340px;
            background: linear-gradient(to bottom, #a1c4fd, #c2e9fb); 
            border: 4px solid #000;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CRT 브라운관 주사선 특수 격자 필터 스크린 */
        .game-container::after {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.04) 2px, transparent 0),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 2px, transparent 0);
            background-size: 16px 16px;
            pointer-events: none;
            z-index: 10;
        }

        /* --- 화면 내부 스크린 UI --- */
        .menu-screen {
            position: absolute;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.2); 
        }

        .menu-title {
            color: #ffffff;
            font-size: 2.6rem;
            margin-top: 0;
            margin-bottom: 30px;
            text-shadow: 4px 4px 0px #ff6b81, -2px -2px 0px #2d3436;
            animation: pulse 1s infinite alternate;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 250px;
        }

        /* 버튼 인테리어 : 청량한 소다 블루 테마 슬롯 */
        .menu-item {
            background-color: #74b9ff; 
            color: white;
            padding: 12px 0;
            font-size: 1.3rem;
            text-align: center;
            border: 3px solid #2d3436;
            box-shadow: 4px 4px 0px #2d3436;
            cursor: pointer;
            font-family: 'DungGeunMo', monospace;
            transition: none; 
        }
        .menu-item:hover {
            background-color: #0984e3;
            color: #ffeaa7; 
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #2d3436;
        }
        .menu-item:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #2d3436;
        }

        /* 2번 지진 모델링 버튼용 파스텔 핑크 커스텀 스킨 */
        .seismic-btn { background-color: #ff7979; }
        .seismic-btn:hover { background-color: #ff5252; }

        /* 🎮 오락기 하단 하드웨어 컨트롤 패널 데크 바 */
        .control-panel {
            width: 540px;
            height: 70px;
            background: #1e2124;
            margin-top: 15px;
            border: 4px solid #000;
            border-radius: 4px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
        }

        /* 조이스틱 조작 레버 모듈 */
        .joystick-wrapper {
            position: relative;
            width: 40px; height: 40px;
        }
        .joystick-base {
            position: absolute;
            width: 30px; height: 12px;
            background: #57606f;
            border: 3px solid #000;
            border-radius: 50%;
            bottom: 0; left: 5px;
        }
        .joystick-stick {
            position: absolute;
            width: 6px; height: 26px;
            background: #ced6e0;
            border: 2px solid #000;
            bottom: 6px; left: 15px;
            transform-origin: bottom center;
            animation: stickWobble 2s ease-in-out infinite;
        }
        .joystick-knob {
            position: absolute;
            width: 18px; height: 18px;
            background: #ff6b81; 
            border: 3px solid #000;
            border-radius: 50%;
            top: -14px; left: -8px;
            box-shadow: inset -3px -3px 0px #e85a71;
        }

        /* 아케이드 게임 파스텔 물리 액션 단추 버튼 스펙트럼 */
        .action-buttons {
            display: flex;
            gap: 14px;
        }
        .arcade-button {
            width: 24px; height: 24px;
            border-radius: 50%;
            border: 3px solid #000;
            cursor: pointer;
            position: relative;
        }
        .arcade-button:active {
            transform: translateY(3px);
        }

        /* 파스텔 솜사탕 톤 */
        .arc-pink { 
            background: #ff7979; /* 딸기 밀크 핑크 버튼 */
            box-shadow: 0px 4px 0px #b33939; 
        }
        .arc-pink:active { box-shadow: 0px 1px 0px #b33939; }

        .arc-blue { 
            background: #74b9ff; /* 네온 소다 블루 버튼 */
            box-shadow: 0px 4px 0px #0984e3; 
        }
        .arc-blue:active { box-shadow: 0px 1px 0px #0984e3; }

        .panel-hint {
            position: absolute;
            bottom: -22px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #888;
            font-size: 0.8rem;
        }

        /* 아케이드 모션 키프레임 목록 */
        @keyframes stickWobble {
            0%, 100% { transform: rotate(0deg); }
            30% { transform: rotate(8deg); }
            70% { transform: rotate(-8deg); }
        }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.03); } }
    </style>
</head>
<body>

    <!-- 🕹️ 레트로 게임기 외곽 하우징 프레임 -->
    <div class="arcade-cabinet">
        
        <!-- 📺 오락기 모니터 화면 구역 -->
        <div class="game-container">
            
            <div class="menu-screen">
                <div class="menu-title">SELECT MENU</div>
                
                <div class="menu-list">
                    <div class="menu-item" onclick="window.location.href='game.html'">1. 도트 게임하기</div>
                    <div class="menu-item seismic-btn" onclick="window.location.href='earth.html'">2. 지진 모델링</div>
                </div>
            </div>
            
        </div>

        <!-- 🕹️ 오락기 본체 하단 스틱/버튼 컨트롤 보드 구역 -->
        <div class="control-panel">
            <!-- 조이스틱 레버 연출 -->
            <div class="joystick-wrapper">
                <div class="joystick-base"></div>
                <div class="joystick-stick">
                    <div class="joystick-knob"></div>
                </div>
            </div>
            
            <!-- 🔗 실제 링크 제어 스위치 기능을 장착한 컬러 물리 버튼 랙 -->
            <div class="action-buttons">
                <!-- 핑크 버튼: 1번 게임 페이지 점프 연동 -->
                <div class="arcade-button arc-pink" title="Go to Game" onclick="window.location.href='game.html'"></div>
                <!-- 소다 블루 버튼: 2번 지진 모델링 페이지 점프 연동 -->
                <div class="arcade-button arc-blue" title="Go to Seismic" onclick="window.location.href='earth.html'"></div>
            </div>

            <div class="panel-hint">* 하단 둥근 컬러 단추들을 클릭해도 각 화면으로 링크 이동합니다!</div>
        </div>

    </div>
</body>
</html>
